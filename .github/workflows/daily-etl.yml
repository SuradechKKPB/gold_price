name: compute-signals

# GTA blocks GitHub's datacenter IPs (403), but the SCORE runs on the world gold price,
# which is public — etl.compute fetches it itself (intl.fetch_live_intl). So this job is
# self-sufficient: no phone required to keep the dashboard score fresh.
#
# This job now owns COMPUTE + event TRANSITION alerts only. The fixed-time daily DIGEST
# (06:00 / 15:00 ICT) moved to a Cloudflare Worker (worker/) because CF cron is precise to
# the second, unlike GitHub's scheduler. The two compute runs at 22:30 / 07:30 UTC refresh
# the score ~30 min BEFORE the Worker reads it for each digest.
# Times are UTC (Asia/Bangkok = UTC+7, no DST).
on:
  schedule:
    - cron: "30 22 * * *"      # 05:30 ICT — refresh before the 06:00 Worker digest
    - cron: "30 7 * * *"       # 14:30 ICT — refresh before the 15:00 Worker digest
    - cron: "0 6,12,18 * * *"  # 13:00 / 19:00 / 01:00 ICT — freshness + transition alerts
  workflow_dispatch: {}

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      - name: Recompute signals from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Needed for TRANSITION alerts (verdict changes). The daily digest is the Worker's job.
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: uv run python -m etl.compute
